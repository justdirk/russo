name: Build site files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack bootstrap bundle
        run: |
          if [ -d bootstrap ]; then
            cat bootstrap/part-*.b64 | base64 -d | tar xz
            rm -rf bootstrap bootstrap.tgz.b64
            echo "unpacked:"; ls -la
          else
            echo "no bootstrap dir; already unpacked"
          fi

      - name: Apply one-off patches
        run: |
          if ls tools/patches/*.py >/dev/null 2>&1; then
            for f in tools/patches/*.py; do python3 "$f" && rm "$f"; done
          else
            echo "no patches"
          fi

      - name: Build photos from their public sources
        run: |
          pip install --quiet pillow
          python3 tools/build_images.py
          ls -la img

      - name: Commit results back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "nothing to commit" || (git commit -m "Build site files [skip ci]" && git push)
