name: Build site files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build everything (never fails; logs to build-log.txt)
        continue-on-error: true
        run: |
          exec > >(tee build-log.txt) 2>&1
          set -x
          date -u
          echo "--- unpack bootstrap ---"
          if [ -d bootstrap ]; then
            cat bootstrap/part-*.b64 | base64 -d | tar xz || echo "UNPACK FAILED"
            rm -rf bootstrap bootstrap.tgz.b64
          else
            echo "no bootstrap dir"
          fi
          echo "--- patches ---"
          for f in tools/patches/*.py; do
            [ -e "$f" ] || { echo "no patches"; break; }
            python3 "$f" && rm "$f" || echo "PATCH FAILED: $f"
          done
          echo "--- images ---"
          pip install --quiet pillow || echo "PILLOW INSTALL FAILED"
          python3 tools/build_images.py || echo "SOME IMAGES FAILED"
          echo "--- prune gallery cells whose image is missing ---"
          python3 - <<'PY'
          import os, re
          s = open('index.html', encoding='utf-8').read()
          pat = re.compile(r'\s*<a href="#prenota"><img src="img/([a-z0-9-]+)\.jpg".*?</a>', re.S)
          dropped = []
          def keep(m):
              if os.path.exists('img/%s.jpg' % m.group(1)):
                  return m.group(0)
              dropped.append(m.group(1)); return ''
          s2 = pat.sub(keep, s)
          if dropped:
              open('index.html', 'w', encoding='utf-8').write(s2)
              print('dropped gallery cells:', dropped)
          else:
              print('all gallery images present')
          PY
          echo "--- final ---"
          ls -la img || echo "no img dir"
          echo "--- done ---"

      - name: Commit whatever we have
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "nothing to commit" || (git commit -m "Build site files [skip ci]" && git push)
